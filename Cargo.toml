[package]
name = "oport"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Dev servers on local ports: a CLI, TUI and data source for the oport Omarchy plugin"
license = "MIT"

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
